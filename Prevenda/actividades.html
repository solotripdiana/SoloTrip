*{box-sizing:border-box}
body{

h1{margin-bottom:12px}

.toolbar{

button.filter{

 min-width: 150px;

  cursor: pointer;

button.filter:hover{

button.filter.active{

.card{

.thumb{

.title{

.desc{

}

.emoji{

  right:10px;
  bottom:-8px;
  font-size:56px;
  opacity:.12;

/* Modal */
.backdrop{

  inset:0;

.modal{

/* =========
   Helpers
   ========= */
const el = sel => document.querySelector(sel);
const els = sel => Array.from(document.querySelectorAll(sel));

function makeCard({ title, subtitle, intro, emoji, image, dataset = {} }){
  const tpl = document.getElementById('restaurant-card-template');
  const node = tpl.content.cloneNode(true);
  const card = node.querySelector('.card');

  card.setAttribute('aria-label', `${title}. Abrir detalhes`);

  Object.entries(dataset).forEach(([k,v]) => card.dataset[k] = v);

  node.querySelector('.thumb').src = image;
  node.querySelector('.thumb').alt = `Miniatura de ${title}`;

  node.querySelector('.tag').textContent = subtitle;
  node.querySelector('.rating').textContent = dataset.rating || '';
  node.querySelector('.title').textContent = title;
  node.querySelector('.desc').textContent = intro;
  node.querySelector('.emoji').textContent = emoji || '';

  const mapLink = node.querySelector('.map-link');
  if (dataset.mapUrl){
    mapLink.href = dataset.mapUrl;
  } else {
    mapLink.remove();
  }

  card.addEventListener('click', ()=> openModalFromDataset(card.dataset));
  card.addEventListener('keydown', e=>{
    if(e.key === 'Enter' || e.key === ' ') card.click();
  });

  return node;
}

/* =========
   Render
   ========= */
function renderRestaurants(list){
  const wrap = el('#cards-restaurantes');
  wrap.innerHTML = '';
  list.forEach(r=>{
    const subtitle = r.cuisine.map(c => c[0].toUpperCase()+c.slice(1)).join(' · ');
    const card = makeCard({
      title: r.name,
      subtitle,
      intro: r.intro,
      emoji: r.emoji,
      image: r.image,
      dataset: {
        type: 'rest',
        rating: r.rating,
        cuisine: r.cuisine.join(','),
        title: r.name,
        intro: r.intro,
        address: r.address,
        instagram: r.instagram,
        emoji: r.emoji,
        image: r.image,
        badges: r.badges.join('|'),
        tags: subtitle
      }
    });
    wrap.appendChild(card);
  });
  el('#count-rest').textContent = `${list.length} resultado(s)`;
  el('#clear-filters')
  .addEventListener('click', clearRestaurantFilters);

}

/* =========
   Modal
   ========= */
const backdrop = el('#backdrop');
const closeBtn = el('#modal-close');

function openModalFromDataset(ds){
  el('#modal-title').textContent = ds.title || '';
  el('#modal-desc').textContent = ds.intro || '';

  const img = el('#modal-image');
  img.src = ds.image || '';
  img.alt = ds.title ? `Imagem de ${ds.title}` : '';

  // 📍 Mapa
  const mapLink = el('#modal-map');
  if (ds.address){
    mapLink.href = ds.address;
    mapLink.style.display = 'inline-flex';
  } else {
    mapLink.style.display = 'none';
  }

  // 📸 Instagram
  const instaLink = el('#modal-insta');
  if (ds.instagram){
    instaLink.href = ds.instagram;
    instaLink.style.display = 'inline-flex';
  } else {
    instaLink.style.display = 'none';
  }

  // Tags
  const tags = el('#modal-tags');
  tags.innerHTML = '';
  (ds.tags || '').split(',').forEach(t=>{
    if(t){
      const span = document.createElement('span');
      span.className = 'badge';
      span.textContent = t;
      tags.appendChild(span);
    }
  });

  // Badges
  const badges = el('#modal-badges');
  badges.innerHTML = '';
  (ds.badges || '').split('|').forEach(b=>{
    if(b){
      const span = document.createElement('span');
      span.className = 'badge';
      span.textContent = b;
      badges.appendChild(span);
    }
  });

  backdrop.classList.add('show');
  backdrop.setAttribute('aria-hidden','false');
}


function closeModal(){
  backdrop.classList.remove('show');
  backdrop.setAttribute('aria-hidden','true');
}
backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeModal(); });
closeBtn.addEventListener('click', closeModal);
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });

/* =========
   Tabs / Filtros / Menu
   ========= */
function setActiveView(viewId){
  els('.tab').forEach(x=> x.classList.toggle('active', x.dataset.view === viewId));
  els('.view').forEach(v=> v.classList.toggle('active', v.id === viewId));
  menu.classList.remove('open');
  burger.setAttribute('aria-expanded','false');
}
els('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=> setActiveView(btn.dataset.view));
});

/* Filtros com correção do “Todos” */
function setupFilters() {
  els('#restaurantes .filter').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.dataset.filter;

      // remover active do grupo
      const parent = btn.parentElement;
      parent.querySelectorAll('.filter')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // estrelas
      if (['★','★★','★★★','★★★★','★★★★★'].includes(f)) {
        activeRating = f;
      }
      // cozinha
      else {
		activeCuisine = f?.toLowerCase() === 'all' ? 'all' : (f?.toLowerCase() || 'all');      }

      applyRestaurantFilters();
    });
  });
}



function applyRestaurantFilters() {
  let list = RESTAURANTS.slice();

  if (activeCuisine !== 'all') {
    list = list.filter(r =>
      r.cuisine.some(c => c.toLowerCase() === activeCuisine)
    );
  }

  if (activeRating !== 'all') {
    list = list.filter(r => r.rating === activeRating);
  }

  renderRestaurants(list);
}

/* =========
   Scroll: anima entrada das panels da Home
   ========= */
function setupHomeScroll(){
  const targets = [el('#panel-dicas'), el('#panel-goodbad')].filter(Boolean);
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  },{ rootMargin:'-10% 0px -10% 0px', threshold: 0.1 });
  targets.forEach(t=> io.observe(t));
}

function clearRestaurantFilters() {
  activeCuisine = 'all';
  activeRating = 'all';

  // remover estados ativos
  els('#restaurantes .filter')
    .forEach(b => b.classList.remove('active'));

  // reativar "Todos" e "Todas"
  el('#restaurantes .filter[data-filter="all"]')?.classList.add('active');
  el('#restaurantes .filter[data-filter="all-stars"]')?.classList.add('active');

  renderRestaurants(RESTAURANTS);
}


/* =========   Boot   ========= */
   
clearRestaurantFilters();
renderRestaurants(RESTAURANTS);
setupFilters();
setupHomeScroll();

/* =========   Fade do Intro ao scroll   ========= */
const intro = document.getElementById('intro');

window.addEventListener('scroll', () => {
  const max = 350;
  const y = Math.min(window.scrollY, max);
  const opacity = 1 - (y / max);

  intro.style.opacity = opacity;
});
